<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18191f"/>
      <stop offset="50%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#0b0c0e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Five Grains (다섯결 엠블럼 - 5 Petals / Pages / Feathers) -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Central Pen/Feather quill -->
    <path d="M0 -150 C24 -90 48 -20 0 160 C-48 -20 -24 -90 0 -150 Z" fill="url(#goldGrad)" opacity="0.95"/>
    <line x1="0" y1="-140" x2="0" y2="150" stroke="#fef3c7" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Grain 1 (Left Outer) -->
    <path d="M-20 -40 C-80 -120 -150 -70 -160 0 C-140 70 -60 50 -10 10" fill="url(#goldGrad)" opacity="0.7"/>
    <!-- Grain 2 (Left Inner) -->
    <path d="M-10 -70 C-50 -130 -110 -110 -110 -40 C-100 30 -40 40 -5 20" fill="url(#glowGrad)" opacity="0.85"/>
    
    <!-- Grain 4 (Right Inner) -->
    <path d="M10 -70 C50 -130 110 -110 110 -40 C100 30 40 40 5 20" fill="url(#glowGrad)" opacity="0.85"/>
    <!-- Grain 5 (Right Outer) -->
    <path d="M20 -40 C80 -120 150 -70 160 0 C140 70 60 50 10 10" fill="url(#goldGrad)" opacity="0.7"/>

    <!-- Small central star spark -->
    <circle cx="0" cy="-60" r="10" fill="#fffbeb"/>
    <circle cx="0" cy="-60" r="18" fill="#fde68a" opacity="0.5"/>
  </g>

  <!-- Title Monogram / Text -->
  <text x="256" y="440" font-family="'Noto Serif KR', serif, sans-serif" font-weight="700" font-size="38" fill="#fef3c7" text-anchor="middle" letter-spacing="4">PENTALYZE</text>
</svg>
